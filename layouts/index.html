{{ define "main" }}
  <h1>{{ .Title | default .Site.Title }}</h1>
  {{ .Content }}

  <h2>Recent Posts</h2>
  <ul>
    {{ range (where .Site.RegularPages "Type" "posts") }}
      <li>
        <a href="{{ .Permalink }}">{{ .Title }}</a> — <time>{{ .Date.Format "January 2, 2006" }}</time>
      </li>
    {{ end }}
  </ul>
{{ end }}
