<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/theme.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/header.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/footer.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/lightbox.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/menu.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/identity-guide.css" | relURL }}">
</head>
<body>

  {{ partial "header.html" . }}

  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>

{{ partial "identity-guide.html" . }}
{{ partial "global-footer.html" . }}
<script src="{{ "js/lightbox.js" | relURL }}"></script>
<script src="{{ "js/menu.js" | relURL }}"></script>
</body>
</html>
