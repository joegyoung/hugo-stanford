{{ define "main" }}
<article class="su-page-content">
  <!-- Page Title -->
  <h1 style="font-size: 2.5rem; color: var(--su-black); margin-bottom: 24px; font-weight: 700;">
    {{ .Title }}
  </h1>
  
  <!-- Page Body Content -->
  <div class="su-page-body" style="font-size: 1.125rem; line-height: 1.75;">
    {{ .Content }}
  </div>
</article>
{{ end }}
